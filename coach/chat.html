<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PennyWise Coach (test chat)</title>
<style>
  :root { --purple: #6B0FC4; --bg: #f6f3fa; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 17px/1.5 system-ui, sans-serif; background: var(--bg); color: #1d1d1f;
         display: flex; flex-direction: column; height: 100vh; }
  header { background: var(--purple); color: #fff; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 19px; margin: 0; }
  header button { background: transparent; color: #fff; border: 1px solid #fff8; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  #log { flex: 1; overflow-y: auto; padding: 20px; max-width: 760px; width: 100%; margin: 0 auto; }
  .msg { padding: 12px 16px; border-radius: 14px; margin: 10px 0; max-width: 85%; white-space: pre-wrap; }
  .user { background: var(--purple); color: #fff; margin-left: auto; }
  .assistant { background: #fff; box-shadow: 0 1px 3px #0001; }
  .error { background: #fde8e8; color: #8a1c1c; }
  .badge { display: inline-block; font-weight: 600; font-size: 14px; padding: 2px 10px; border-radius: 99px; margin-top: 8px; }
  .GO { background: #d9f5e3; color: #11643a; } .THINK_TWICE { background: #fff1c7; color: #7a5600; } .SKIP { background: #fde0e0; color: #8a1c1c; }
  details { margin-top: 6px; font-size: 13px; color: #555; } pre { white-space: pre-wrap; margin: 4px 0 0; }
  form { display: flex; gap: 10px; padding: 14px 20px; background: #fff; border-top: 1px solid #e5e0ee; max-width: 760px; width: 100%; margin: 0 auto; }
  input { flex: 1; font: inherit; padding: 12px 14px; border: 1px solid #cfc6dd; border-radius: 10px; }
  form button { font: inherit; background: var(--purple); color: #fff; border: 0; border-radius: 10px; padding: 0 20px; cursor: pointer; }
  form button:disabled { opacity: .5; }
  #tracker { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 20px; background: #efe8f8;
             border-bottom: 1px solid #e0d6ee; font-size: 15px; }
  #tracker strong { color: var(--purple); margin-right: 4px; }
  #tracker input, #tracker select { font: inherit; padding: 6px 10px; border: 1px solid #cfc6dd; border-radius: 8px; }
  #tracker input[name=item] { flex: 1; min-width: 160px; } #tracker input[name=price] { width: 90px; }
  #tracker button { font: inherit; background: var(--purple); color: #fff; border: 0; border-radius: 8px; padding: 6px 14px; cursor: pointer; }
  .WORTH_IT { background: #d9f5e3; color: #11643a; } .DEPENDS { background: #fff1c7; color: #7a5600; } .NOT_WORTH_IT { background: #fde0e0; color: #8a1c1c; }
  .badge + .badge { margin-left: 6px; }
  footer { text-align: center; font-size: 12px; color: #666; padding: 0 0 10px; background: #fff; }
</style>
</head>
<body>
<header><h1>PennyWise Coach</h1><button id="reset" type="button">New chat</button></header>
<form id="tracker">
  <strong>Purchase tracker</strong>
  <input name="item" placeholder="Item, e.g. espresso machine" required maxlength="200">
  <input name="price" type="number" step="0.01" min="0.01" placeholder="£" required>
  <select name="category"><option>Shopping</option><option>Food</option><option>Takeaway</option><option>Transport</option>
    <option>Entertainment</option><option>Education</option><option>Healthcare</option><option>Bills</option><option>Other</option></select>
  <label><input type="checkbox" name="planning"> Just thinking about it</label>
  <button>Log purchase</button>
</form>
<div id="log"></div>
<form id="form"><input id="input" placeholder="Try: Should I buy trainers for £60?" autocomplete="off" autofocus><button>Send</button></form>
<footer>Guidance, not regulated financial advice. We never approve credit.</footer>
<script>
const log = document.getElementById('log'), form = document.getElementById('form'), input = document.getElementById('input');
let history = [];
const TRAIN = location.pathname === '/train';
const ENDPOINT = TRAIN ? '/api/train' : '/api/coach';
if (TRAIN) {
  document.title = 'PennyWise Coach (training mode)';
  document.querySelector('header h1').innerHTML = 'PennyWise Coach · Training mode <a href="/api/train/rules" target="_blank" style="color:#fff;font-size:14px;font-weight:400;margin-left:10px">View rules file</a>';
  document.documentElement.style.setProperty('--purple', '#3d0a73');
  input.placeholder = 'Teach a rule, e.g. Always mention student discounts for travel';
}
const LABEL = { GO: 'Go', THINK_TWICE: 'Think twice', SKIP: 'Skip for now' };
const WORTH = { WORTH_IT: 'Worth it', DEPENDS: 'Depends', NOT_WORTH_IT: 'Probably not worth it' };
if (TRAIN) document.getElementById('tracker').remove();

function add(role, text, extra) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text.replace(/\*\*(.+?)\*\*/g, '$1');
  if (extra) div.appendChild(extra);
  log.appendChild(div); log.scrollTop = log.scrollHeight;
  return div;
}

function facts(data) {
  const wrap = document.createElement('div');
  const badge = (cls, text) => { const b = document.createElement('span'); b.className = 'badge ' + cls; b.textContent = text; wrap.appendChild(b); };
  if (data.worth_check) badge(data.worth_check.worth_verdict, 'Worth it? ' + WORTH[data.worth_check.worth_verdict]);
  for (const [key, title] of [['purchase_check', 'Can you afford it?'], ['trip_plan', 'Trip plan']]) {
    const f = data[key]; if (!f) continue;
    const verdict = f.verdict || (f.affordability && f.affordability.verdict);
    if (verdict) badge(verdict, title + ' ' + LABEL[verdict]);
  }
  const shown = Object.fromEntries(['purchase_check', 'value_check', 'worth_check', 'trip_plan'].filter(k => data[k]).map(k => [k, data[k]]));
  if (Object.keys(shown).length) {
    const d = document.createElement('details'); d.innerHTML = '<summary>Numbers from the rules engine</summary>';
    const pre = document.createElement('pre'); pre.textContent = JSON.stringify(shown, null, 2); d.appendChild(pre); wrap.appendChild(d);
  }
  return wrap.childNodes.length ? wrap : null;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const message = input.value.trim(); if (!message) return;
  input.value = ''; add('user', message);
  const btn = form.querySelector('button'); btn.disabled = true;
  const thinking = add('assistant', 'Thinking…');
  try {
    const res = await fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                            body: JSON.stringify({ message, history }) });
    const data = await res.json();
    thinking.remove();
    if (!res.ok) throw new Error(typeof data.detail === 'string' ? data.detail : JSON.stringify(data.detail));
    add('assistant', data.reply + (TRAIN ? '\n\n(' + data.rules.length + ' rules saved)' : ''), TRAIN ? null : facts(data));
    history.push({ role: 'user', content: message }, { role: 'assistant', content: data.reply });
  } catch (err) {
    thinking.remove(); add('error', 'Something went wrong: ' + err.message);
  } finally { btn.disabled = false; input.focus(); }
});

document.getElementById('tracker').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target, btn = f.querySelector('button');
  const body = { item: f.item.value.trim(), price: parseFloat(f.price.value), category: f.category.value,
                 status: f.planning.checked ? 'planning' : 'bought' };
  add('user', (body.status === 'bought' ? 'Logged: ' : 'Thinking about: ') + body.item + ' £' + body.price.toFixed(2));
  btn.disabled = true; const thinking = add('assistant', 'Looking at this purchase…');
  try {
    const res = await fetch('/api/purchase-review', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const data = await res.json(); thinking.remove();
    if (!res.ok) throw new Error(typeof data.detail === 'string' ? data.detail : JSON.stringify(data.detail));
    add('assistant', data.explanation, facts(data));
    history = history.concat(data.history);   // keep chatting about it below
    f.reset(); input.focus();
  } catch (err) { thinking.remove(); add('error', 'Something went wrong: ' + err.message); }
  finally { btn.disabled = false; }
});

document.getElementById('reset').onclick = () => { history = []; log.innerHTML = ''; input.focus(); };
add('assistant', TRAIN
  ? "Training mode. Tell me rules for the coach and I'll save them to coach/coach_rules.md. You can say things like \"list the rules\" or \"remove rule 2\". Test the coach afterwards at /chat."
  : "Hi! I'm your money coach. Ask me if you can afford something, plan a trip, or ask what a banking term means.");
</script>
</body>
</html>
